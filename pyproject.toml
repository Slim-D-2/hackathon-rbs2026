[project]
name = "hackathon-rbs2026"
version = "0.1.0"
description = "Azure RAG & Agentic Hackathon"
requires-python = ">=3.12"
dependencies = [
    # Azure Core
    "azure-identity>=1.17.0",
    "azure-search-documents>=11.4.0",
    "azure-storage-blob>=12.19.0",

    # Frameworks & Orchestration
    "langchain-azure-ai>=0.1.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",

    # Data Processing & Utilities
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",

    # Fast API Endpoint (if building web interface)
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]